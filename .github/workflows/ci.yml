name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # ── Dockerfile lint ────────────────────────────────────────────────────────
  lint-docker:
    name: Lint Dockerfiles
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml

  # ── C static analysis ──────────────────────────────────────────────────────
  lint-c:
    name: Lint C sources (cppcheck)
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck
      - name: cppcheck libpksave/src
        run: |
          cppcheck \
            --error-exitcode=1 \
            --std=c99 \
            --enable=warning,performance,portability \
            --suppress=missingIncludeSystem \
            -DPKSAVE_GEN1 -DPKSAVE_GEN2 -DPKSAVE_GEN3 \
            -DPKSAVE_GEN4 -DPKSAVE_GEN5 \
            -Ilibpksave/include \
            -Ilibpksave/src \
            libpksave/src/

  # ── Python lint ────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check libpksave/tests/fixtures/ tools/

  # ── libpksave Unity tests ──────────────────────────────────────────────────
  test-libpksave:
    name: Test libpksave (all generations)
    needs: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/test
          tags: pksave-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Unity tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" pksave-test
